[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pain-signal-detector"
version = "0.1.0"
description = "Deterministic assessment of supplied public operational evidence"
requires-python = ">=3.10"

[project.scripts]
psd = "pain_signal_detector.cli:main"

[tool.setuptools.packages.find]
include = ["pain_signal_detector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
